name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   name: Linux }
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKG_COPY_AFTER_BUILD=OFF

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Firma ad-hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in build/GroQ4_artefacts/Release/VST3/*.vst3 build/GroQ4_artefacts/Release/AU/*.component build/GroQ4_artefacts/Release/Standalone/*.app; do
            codesign --force --deep -s - "$f"
          done

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: GroQ4-${{ matrix.name }}
          path: |
            build/GroQ4_artefacts/Release/VST3
            build/GroQ4_artefacts/Release/AU
            build/GroQ4_artefacts/Release/Standalone
            build/GroQ4_artefacts/VST3
            build/GroQ4_artefacts/Standalone
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Empaquetar
        run: |
          cd artefactos
          for d in */; do n="${d%/}"; (cd "$n" && zip -r -y "../../$n.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
